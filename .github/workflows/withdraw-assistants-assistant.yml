name: Withdraw exact Assistant's Assistant social release
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Exact owner-authorized incident; inspect first, never retries
        type: choice
        options: [inspect, withdraw]
        default: inspect
permissions:
  contents: read
concurrency:
  group: sorry-tomorrow-social-publication-ledger
  cancel-in-progress: false
jobs:
  withdraw:
    if: github.repository == 'Sorry-Tomorrow/sorrytomorrow.com' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
      - name: Validate without secrets
        run: node --test tests/social-withdrawal.test.mjs tests/social-publishing.test.mjs
      - name: Inspect or withdraw exact owner-selected posts
        env:
          WITHDRAWAL_MODE: ${{ inputs.mode }}
          GITHUB_TOKEN: ${{ github.token }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: node scripts/social/withdraw-assistants-assistant.mjs "$WITHDRAWAL_MODE"
